<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriMOod-NutriCatch</title>
    <link rel="icon" href="./image/logo.png" type="image/png">
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Arvo'>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Arvo', serif;
        background: linear-gradient(135deg,rgb(31, 109, 42) 0%, #d12c2c 100%);
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      h1 {
        margin-top: 20px;
        font-size: 2.5rem;
        color: #f8f9fa;
      }

      canvas {
        border: none;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        display: block;
        margin: 20px auto;
      }

      .health-bar-container {
        width: 80%;
        max-width: 400px;
        height: 20px;
        background: #3d3d3d;
        border-radius: 10px;
        margin: 10px auto;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .health-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(to right, #4caf50, #81c784);
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .game-button-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 15px;
      }

      .circle-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: #1b263b;
        border: 2px solid #778da9;
        color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition: background-color 0.3s, transform 0.2s;
      }

      .circle-btn:hover {
        background-color: #415a77;
        transform: scale(1.05);
      }

      #loadingScreen,
      #startScreen,
      #gameOverScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(13, 27, 42, 0.95);
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #f8f9fa;
        padding: 20px;
      }

      #gameOverScreen {
        background: rgba(0, 0, 0, 0.9);
        color: #ff6b6b;
        display: none;
      }

      button#startBtn,
      button#restartBtn {
        padding: 12px 28px;
        font-size: 16px;
        margin: 12px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #4caf50;
        color: white;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        transition: background-color 0.3s, transform 0.2s;
      }

      button#startBtn:hover,
      button#restartBtn:hover {
        background-color: #66bb6a;
        transform: translateY(-2px);
      }

      p {
        font-size: 16px;
        color: #cbd5e1;
        margin: 5px;
      }
      /* Decorative bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      z-index: 0;
    }

    .bubble1 {
      width: 120px;
      height: 120px;
      background: #22c55e;
      top: 20%;
      left: -60px;
    }

    .bubble2 {
      width: 200px;
      height: 200px;
      background: #a3e635;
      bottom: 10%;
      right: -100px;
    }

    .bubble3 {
      width: 80px;
      height: 80px;
      background: #bef264;
      top: 60%;
      left: 20%;
    }
    </style>
  </head>
  <body>
      <!-- Decorative bubbles -->
  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>
  <div class="bubble bubble3"></div>

    <h1>NutriCatch</h1>

    <div class="health-bar-container">
      <div class="health-bar" id="healthBar"></div>
    </div>
    <p>Health: <span id="healthText">100%</span></p>
    <p>Skor: <span id="scoreText">0</span></p>

    <canvas id="gameCanvas" width="500" height="600"></canvas>

    <div class="game-button-container">
      <button class="circle-btn" id="pauseBtn">
        <i class="fas fa-pause"></i>
      </button>
      <button class="circle-btn" id="resumeBtn" style="display: none">
        <i class="fas fa-play"></i>
      </button>
      <button class="circle-btn" id="restartBtn2">
        <i class="fas fa-rotate-right"></i>
      </button>
    </div>

    <div id="loadingScreen">Loading game...</div>
    <div id="startScreen" style="display: none">
      <h2>Selamat Datang di NutriCatch!</h2>
      <button id="startBtn">Mulai Game</button>
    </div>

    <div id="gameOverScreen">
      <h2>Game Over!</h2>
      <p>Skor Anda: <span id="finalScore">0</span></p>
      <p>Skor Tertinggi: <span id="highScore">0</span></p>
      <button id="restartBtn">Main Lagi</button>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const playerHealthy = new Image();
      playerHealthy.src = "./image/sehat.png";
      const playerFat = new Image();
      playerFat.src = "./image/gemuk.png";

      const healthyFoodImgs = ["./image/healthy1.png", "./image/healthy4.png"].map(loadImage);
      const junkFoodImgs = ["./image/junkfood.png", "./image/junk2.png"].map(loadImage);

      const bgMusic = new Audio("./audio/bgm.mp3");
      bgMusic.loop = true;
      bgMusic.volume = 0.6;

      const yumSound = new Audio("./audio/yum.mp3");
      const gameOverSound = new Audio("./audio/game_over.mp3");

      let player, foods, score, gameOver, paused, dropInterval;
      let foodQueue = [];
      let foodIndex = 0;
      let highScore = localStorage.getItem("highScore") || 0;

      const allFoodVariants = [
        ...healthyFoodImgs.map((img) => ({ type: "healthy", img })),
        ...junkFoodImgs.map((img) => ({ type: "junk", img })),
      ];

      function loadImage(src) {
        const img = new Image();
        img.src = src;
        return img;
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function resetInterval() {
        if (dropInterval) clearInterval(dropInterval);
      }

      function startDroppingFoods() {
        resetInterval();
        foodIndex = 0;
        foodQueue = shuffleArray([...allFoodVariants]);

        dropInterval = setInterval(() => {
          if (gameOver || paused) return;

          if (foodIndex >= foodQueue.length) {
            startDroppingFoods(); // reshuffle
            return;
          }

          const foodItem = foodQueue[foodIndex++];
          foods.push({
            x: Math.random() * (canvas.width - 40),
            y: 0,
            width: 40,
            height: 40,
            speed: 3,
            type: foodItem.type,
            img: foodItem.img,
          });
        }, 500);
      }

      function initGame() {
        resetInterval();

        player = {
          x: 210,
          y: 510,
          width: 50,
          height: 90,
          health: 100,
          image: playerHealthy,
        };
        foods = [];
        score = 0;
        gameOver = false;
        paused = false;

        updateUI(100, 0);
        toggleElement("gameOverScreen", false);
        toggleElement("resumeBtn", false);
        toggleElement("pauseBtn", true);

        bgMusic.currentTime = 0;
        bgMusic.play();

        startDroppingFoods();
        gameLoop();
      }

      function updateUI(health, score) {
        document.getElementById("healthBar").style.width = health + "%";
        document.getElementById("healthText").innerText = health + "%";
        document.getElementById("scoreText").innerText = score;
      }

      function toggleElement(id, show) {
        document.getElementById(id).style.display = show ? "inline-flex" : "none";
      }

      function update() {
        if (gameOver || paused) return;

        for (let i = foods.length - 1; i >= 0; i--) {
          const food = foods[i];
          food.y += food.speed;

          if (
            food.y + food.height >= player.y &&
            food.y <= player.y + player.height &&
            food.x < player.x + player.width &&
            food.x + food.width > player.x
          ) {
            if (food.type === "healthy") {
              player.health = Math.min(100, player.health + 10);
              score += 10;
            } else {
              player.health = Math.max(0, player.health - 15);
            }
            foods.splice(i, 1);
            yumSound.currentTime = 0;
            yumSound.play();
          }
        }

        foods = foods.filter((f) => f.y < canvas.height);
        updateUI(player.health, score);
        player.image = player.health < 50 ? playerFat : playerHealthy;

        if (player.health <= 0) {
          gameOver = true;
          endGame();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(player.image, player.x, player.y, player.width, player.height);
        foods.forEach((food) => ctx.drawImage(food.img, food.x, food.y, food.width, food.height));
      }

      function gameLoop() {
        if (!gameOver && !paused) {
          update();
          draw();
          requestAnimationFrame(gameLoop);
        }
      }

      function endGame() {
        document.getElementById("finalScore").innerText = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("highScore", highScore);
        }
        document.getElementById("highScore").innerText = highScore;
        document.getElementById("gameOverScreen").style.display = "flex";
        bgMusic.pause();
        gameOverSound.play();
        resetInterval();
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" && player.x > 0) player.x -= 20;
        if (e.key === "ArrowRight" && player.x + player.width < canvas.width) player.x += 20;
      });

      document.getElementById("restartBtn").addEventListener("click", initGame);
      document.getElementById("restartBtn2").addEventListener("click", initGame);

      document.getElementById("pauseBtn").addEventListener("click", () => {
        paused = true;
        bgMusic.pause();
        toggleElement("pauseBtn", false);
        toggleElement("resumeBtn", true);
      });

      document.getElementById("resumeBtn").addEventListener("click", () => {
        paused = false;
        bgMusic.play();
        toggleElement("resumeBtn", false);
        toggleElement("pauseBtn", true);
        gameLoop();
      });

      window.onload = () => {
        setTimeout(() => {
          document.getElementById("loadingScreen").style.display = "none";
          document.getElementById("startScreen").style.display = "flex";
        }, 2000);
      };

      document.getElementById("startBtn").addEventListener("click", () => {
        document.getElementById("startScreen").style.display = "none";
        initGame();
      });
    </script>
  </body>
</html>
